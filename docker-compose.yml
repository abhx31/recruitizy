services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    # On prod the image is pulled from GHCR (BACKEND_IMAGE set by deploy
    # script). Locally the env var is unset so we fall back to a local tag,
    # and `build:` below builds it on first `compose up`. Both paths produce
    # the same runtime — only the source of bits differs.
    image: ${BACKEND_IMAGE:-recruitizy-backend:local}
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      # Inside the compose network, redis is reachable by service name, not localhost
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    labels:
      # Opt this container in to autoheal's restart-on-unhealthy behavior.
      autoheal: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Grace period during boot — alembic migrations + app startup take a bit.
      start_period: 30s

  worker:
    # Same image as `backend` — shared bits, different entrypoint command.
    # Avoids building two near-identical images.
    image: ${BACKEND_IMAGE:-recruitizy-backend:local}
    build:
      context: ./backend
    restart: unless-stopped
    command: ["worker"]
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    labels:
      autoheal: "true"
    healthcheck:
      # `celery inspect ping` returns non-zero when the worker isn't responsive.
      # $$HOSTNAME (double dollar) escapes compose's interpolation so the
      # container sees a literal $HOSTNAME which the shell then resolves.
      test: ["CMD-SHELL", "celery -A app.core.celery inspect ping -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  autoheal:
    # Sidecar that watches Docker's healthcheck reports and restarts any
    # container labeled `autoheal=true` that goes unhealthy. Without this,
    # `restart: unless-stopped` only restarts on container EXIT, not on a
    # container that's "running" but reporting unhealthy.
    image: willfarrell/autoheal:latest
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "10"      # how often to scan for unhealthy containers (seconds)
      AUTOHEAL_START_PERIOD: "30"  # don't restart anything during its grace period
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  redis-data:

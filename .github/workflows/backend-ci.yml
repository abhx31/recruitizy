name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build:
    name: Build & sanity-check image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: recruitizy-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Import smoke test
        run: |
          docker run --rm \
            --entrypoint python \
            recruitizy-backend:ci \
            -c "import app.main; print('imports ok')"
